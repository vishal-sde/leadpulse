spring:
  application:
    name: leadpulse

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

zoho:
  client-id: ${ZOHO_CLIENT_ID}
  client-secret: ${ZOHO_CLIENT_SECRET}
  refresh-token: ${ZOHO_REFRESH_TOKEN}
  accounts-url: ${ZOHO_ACCOUNTS_URL}
  api-domain: ${ZOHO_API_DOMAIN}
